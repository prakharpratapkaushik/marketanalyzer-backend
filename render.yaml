services:
  - type: web
    name: marketanalyzer-backend
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketanalyzer-db
          property: connectionString
      # Spring's JDBC driver receives these separately from the connection URL.
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: marketanalyzer-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: marketanalyzer-db
          property: password
      - key: APP_AUTH_DEMO_EMAIL
        value: demo@marketanalyzer.com
      - key: APP_AUTH_DEMO_PASSWORD
        generateValue: true

databases:
  - name: marketanalyzer-db
    plan: free
    databaseName: marketanalyzer
    user: marketanalyzer
